<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="waxGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#a36b7a"/>
      <stop offset="45%" stop-color="#80515e"/>
      <stop offset="85%" stop-color="#5a333f"/>
      <stop offset="100%" stop-color="#3d1e27"/>
    </radialGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4b5"/>
      <stop offset="50%" stop-color="#d0af70"/>
      <stop offset="100%" stop-color="#8c6a2e"/>
    </linearGradient>
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#28161d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Wax Seal Silhouette with organic stamp ripples -->
  <path d="M32 4 C38 3, 44 6, 49 10 C54 14, 58 19, 60 25 C62 31, 61 38, 58 44 C55 50, 50 55, 44 58 C38 61, 31 62, 25 60 C19 58, 14 54, 10 49 C6 44, 3 38, 4 32 C5 26, 8 20, 13 15 C18 10, 25 5, 32 4 Z"
        fill="url(#waxGrad)" filter="url(#sealShadow)"/>

  <!-- Inner Embossed Golden Beaded Ring -->
  <circle cx="32" cy="32" r="21" stroke="url(#goldRing)" stroke-width="1.6" stroke-dasharray="2 1.5" opacity="0.85"/>
  <circle cx="32" cy="32" r="18.5" stroke="#ffe0e9" stroke-width="0.8" opacity="0.4"/>

  <!-- Heart Monogram -->
  <path d="M32 41 C32 41 20 33.5 20 25.5 C20 21.5 23 18.5 27 18.5 C29.5 18.5 31.2 19.8 32 21 C32.8 19.8 34.5 18.5 37 18.5 C41 18.5 44 21.5 44 25.5 C44 33.5 32 41 32 41 Z"
        fill="#FFF8F8" stroke="#ffe0e9" stroke-width="0.5"/>
</svg>
